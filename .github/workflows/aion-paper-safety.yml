name: AION PAPER safety regression

on:
  push:
    paths:
      - 'aion_alpaca_paper_algo.py'
      - 'argus_readonly_data.py'
      - 'argus_readonly_mcp.py'
      - 'tests/test_argus_readonly_data.py'
      - 'test_aion_paper_safety.py'
      - '.github/workflows/aion-paper-safety.yml'
  pull_request:
    paths:
      - 'aion_alpaca_paper_algo.py'
      - 'argus_readonly_data.py'
      - 'argus_readonly_mcp.py'
      - 'tests/test_argus_readonly_data.py'
      - 'test_aion_paper_safety.py'
      - '.github/workflows/aion-paper-safety.yml'
  workflow_dispatch:

jobs:
  paper-safety:
    name: 20 offline PAPER safeguards (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      AION_SAFETY_WINDOW_PROFILE: local_0931_1445
      AION_MODE: SIMULATION
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal offline test dependencies
        run: python -m pip install python-dotenv tzdata
      - name: Execute isolated safety regression tests
        run: python -m unittest -v test_aion_paper_safety

  argus-readonly:
    name: ARGUS read-only connector regression (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline read-only security and journal tests
        run: python -m unittest discover -s tests -p test_argus_readonly_data.py -v
      - name: Python syntax validation (no MCP/network needed)
        run: python -m py_compile argus_readonly_data.py argus_readonly_mcp.py
